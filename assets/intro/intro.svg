<svg width="1200" height="390" viewBox="0 0 1200 390" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>

```
<!-- Matte surface -->
<linearGradient id="surface" x1="600" y1="0" x2="600" y2="390" gradientUnits="userSpaceOnUse">
  <stop stop-color="#111111"/>
  <stop offset="1" stop-color="#080808"/>
</linearGradient>

<!-- Ambient light -->
<radialGradient id="ambient" cx="0" cy="0" r="1"
  gradientUnits="userSpaceOnUse"
  gradientTransform="translate(600 105) rotate(90) scale(220 500)">
  <stop stop-color="#FFFFFF" stop-opacity="0.075"/>
  <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.025"/>
  <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
</radialGradient>

<!-- Glass -->
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
  <stop stop-color="#FFFFFF" stop-opacity="0.065"/>
  <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.025"/>
</linearGradient>

<!-- Glass highlight -->
<linearGradient id="highlight" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#FFFFFF" stop-opacity="0.12"/>
  <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.015"/>
  <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
</linearGradient>

<!-- Soft shadow -->
<filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
  <feGaussianBlur stdDeviation="18"/>
</filter>

<!-- Ambient blur -->
<filter id="blur">
  <feGaussianBlur stdDeviation="40"/>
</filter>
```

  </defs>

